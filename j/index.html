<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>My Love ❤️</title>

<style>
body {
    text-align: center;
    font-family: Arial;
    background: linear-gradient(to bottom, #ffcccc, #ffe6e6);
}

#content {
    display: none;
}

img {
    width: 200px;
    margin: 10px;
    border-radius: 20px;
}

button {
    padding: 10px 20px;
    background-color: #ff3366;
    color: white;
    border: none;
    border-radius: 10px;
}
</style>
</head>

<body>

<h2>ادخلي الباسورد ❤️</h2>

<input type="12345678" id="pass">
<br><br>
<button onclick="checkPass()">دخول</button>

<div id="content">
    <h1>بحبك ❤️</h1>

    <img src="photo1.jpg">
    <img src="photo2.jpg">
    <img src="photo3.jpg">

    <button onclick="playMusic()">شغلي الأغنية 🎵</button>

    <audio id="music" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>
</div>

<script>
function checkPass() {
    if(document.getElementById("pass").value === "12345678") {
        document.getElementById("content").style.display = "block";
    } else {
        alert("غلط 😅");
    }
}

function playMusic() {
    document.getElementById("music").play();
}
</script>

</body>
</html>
